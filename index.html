<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Absensi RT - QR Code</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  .tab-active { background-color: #4f46e5; color: white; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-success { background:#065f46; color:#fff; }
  .toast-error { background:#991b1b; color:#fff; }
  .hidden { display: none; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- OVERLAY LOGIN -->
  <div id="login-overlay" class="fixed inset-0 bg-indigo-600 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-xs space-y-4">
      <div class="text-center">
        <h1 class="text-lg font-bold">📋 Absensi RT</h1>
        <p class="text-slate-500 text-sm">Masukkan PIN pengurus untuk masuk</p>
      </div>
      <form id="login-form" class="space-y-3">
        <input id="login-pin" type="password" inputmode="numeric" required placeholder="PIN" class="border rounded-lg px-3 py-2 text-sm w-full text-center tracking-widest" />
        <p id="login-error" class="hidden text-red-600 text-xs text-center"></p>
        <button class="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">Masuk</button>
      </form>
    </div>
  </div>

  <div id="app-root" class="hidden">

  <header class="bg-indigo-600 text-white py-5 px-4 shadow">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold">📋 Absensi RT — QR Code</h1>
        <p class="text-indigo-100 text-sm">Kelola kegiatan, warga, dan absensi kehadiran</p>
      </div>
      <button id="logout-btn" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg whitespace-nowrap">Keluar</button>
    </div>
  </header>

  <nav class="max-w-3xl mx-auto flex gap-2 px-4 mt-4 overflow-x-auto">
    <button id="tab-kegiatan" class="tab-active px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-200 whitespace-nowrap">Kegiatan</button>
    <button id="tab-warga" class="px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-200 whitespace-nowrap">Warga & QR</button>
    <button id="tab-scan" class="px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-200 whitespace-nowrap">Scan Absensi</button>
    <button id="tab-laporan" class="px-4 py-2 rounded-full text-sm font-medium bg-white border border-slate-200 whitespace-nowrap">Laporan</button>
  </nav>

  <main class="max-w-3xl mx-auto p-4 space-y-4">

    <!-- PANEL: KEGIATAN -->
    <section id="panel-kegiatan" class="space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
        <h2 class="font-semibold mb-3">Tambah Kegiatan</h2>
        <form id="form-kegiatan" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input name="nama" required placeholder="Nama kegiatan (mis. Kerja Bakti)" class="border rounded-lg px-3 py-2 text-sm sm:col-span-2" />
          <input name="tanggal" type="date" required class="border rounded-lg px-3 py-2 text-sm" />
          <input name="lokasi" placeholder="Lokasi" class="border rounded-lg px-3 py-2 text-sm" />
          <button class="sm:col-span-2 bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">Simpan Kegiatan</button>
        </form>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-left text-slate-500">
            <tr><th class="p-3">Nama</th><th class="p-3">Tanggal</th><th class="p-3">Lokasi</th><th class="p-3">Status</th></tr>
          </thead>
          <tbody id="kegiatan-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- PANEL: WARGA -->
    <section id="panel-warga" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
        <h2 class="font-semibold mb-3">Daftarkan Warga</h2>
        <form id="form-warga" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input name="nama" required placeholder="Nama lengkap" class="border rounded-lg px-3 py-2 text-sm sm:col-span-2" />
          <input name="rt" placeholder="RT" class="border rounded-lg px-3 py-2 text-sm" />
          <input name="rw" placeholder="RW" class="border rounded-lg px-3 py-2 text-sm" />
          <input name="nohp" placeholder="No. HP" class="border rounded-lg px-3 py-2 text-sm" />
          <input name="alamat" placeholder="Alamat" class="border rounded-lg px-3 py-2 text-sm" />
          <button class="sm:col-span-2 bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">Simpan Warga</button>
        </form>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
        <input id="warga-search" placeholder="Cari nama warga..." class="border rounded-lg px-3 py-2 text-sm w-full mb-3" />
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-slate-500">
              <tr><th class="p-3">Nama</th><th class="p-3">RT/RW</th><th class="p-3">No. HP</th><th class="p-3">QR</th></tr>
            </thead>
            <tbody id="warga-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- PANEL: SCAN -->
    <section id="panel-scan" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
        <h2 class="font-semibold">Scan Absensi</h2>
        <select id="scan-kegiatan" class="border rounded-lg px-3 py-2 text-sm w-full"></select>

        <div id="qr-reader" class="rounded-lg overflow-hidden"></div>

        <div class="flex gap-2">
          <button id="scan-start" class="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">Mulai Kamera</button>
          <button id="scan-stop" class="hidden flex-1 bg-slate-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-slate-700">Hentikan Kamera</button>
        </div>

        <details class="text-sm">
          <summary class="cursor-pointer text-slate-500">Input manual (tanpa kamera)</summary>
          <form id="scan-manual-form" class="flex gap-2 mt-2">
            <input id="scan-manual-input" placeholder="Ketik/scan ID warga (mis. WRG-...)" class="border rounded-lg px-3 py-2 text-sm flex-1" />
            <button class="bg-indigo-600 text-white rounded-lg px-4 text-sm font-medium hover:bg-indigo-700">Absen</button>
          </form>
        </details>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100">
        <h3 class="font-semibold mb-2 text-sm">Log Absen Terbaru</h3>
        <ul id="scan-log" class="space-y-1 text-sm"></ul>
      </div>
    </section>

    <!-- PANEL: LAPORAN -->
    <section id="panel-laporan" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 space-y-3">
        <div class="flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between">
          <select id="laporan-kegiatan" class="border rounded-lg px-3 py-2 text-sm flex-1"></select>
          <button id="laporan-export" class="bg-emerald-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-emerald-700 whitespace-nowrap">Export CSV</button>
        </div>
        <p id="laporan-total" class="text-sm text-slate-500"></p>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-left text-slate-500">
              <tr><th class="p-3">Nama</th><th class="p-3">Waktu</th><th class="p-3">Status</th></tr>
            </thead>
            <tbody id="laporan-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL QR -->
  <div id="qr-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl p-5 w-full max-w-xs text-center space-y-3">
      <h3 id="qr-modal-nama" class="font-semibold"></h3>
      <canvas id="qr-canvas" class="mx-auto"></canvas>
      <div class="flex gap-2">
        <button id="qr-download" class="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">Unduh PNG</button>
        <button id="qr-modal-close" class="flex-1 bg-slate-200 rounded-lg py-2 text-sm font-medium hover:bg-slate-300">Tutup</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  </div><!-- /app-root -->

  <script src="app.js"></script>
</body>
</html>
